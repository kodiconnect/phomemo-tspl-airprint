name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - name: PPD is up to date with tools/gen-ppd.py
        run: python3 tools/gen-ppd.py | diff - ppd/phomemo-pm64d.ppd

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/smoke.sh
